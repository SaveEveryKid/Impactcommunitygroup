name: Deploy

# Every push to main: test, migrate Supabase, configure auth + Stripe, deploy to Cloudflare.
# Required repository secrets and variables are listed in docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SB: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ACCT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CF" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$SB" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$ACCT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Deployment skipped. Missing configuration:$missing (see docs/DEPLOYMENT.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_BRAND_NAME: ${{ vars.NEXT_PUBLIC_BRAND_NAME || 'Kindred Commons' }}
      NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV || 'production' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_ALLOW_LIVE: ${{ vars.STRIPE_ALLOW_LIVE || 'false' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # No custom domain yet? Leave NEXT_PUBLIC_SITE_URL unset and the site runs at
      # https://<worker-name>.<account-subdomain>.workers.dev
      - name: Resolve site URL
        run: |
          if [ -n "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "Using custom domain: $NEXT_PUBLIC_SITE_URL"
          else
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
            if [ -z "$sub" ] || [ "$sub" = "null" ]; then
              echo "::error::No workers.dev subdomain found. In Cloudflare open Workers & Pages once to claim one, or set NEXT_PUBLIC_SITE_URL."
              exit 1
            fi
            name=$(node -e 'const t=require("fs").readFileSync("wrangler.jsonc","utf8").replace(/^\s*\/\/.*$/gm,"");console.log(JSON.parse(t).name)')
            url="https://$name.$sub.workers.dev"
            echo "No custom domain set; using $url"
            echo "NEXT_PUBLIC_SITE_URL=$url" >> "$GITHUB_ENV"
          fi

      - name: Apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Read Supabase API keys
        id: sbkeys
        run: |
          keys=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true")
          anon=$(echo "$keys" | jq -r '[.[] | select(.name=="anon")][0].api_key')
          service=$(echo "$keys" | jq -r '[.[] | select(.name=="service_role")][0].api_key')
          echo "::add-mask::$anon"
          echo "::add-mask::$service"
          echo "anon=$anon" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

      - name: Configure Supabase Auth (URLs, templates, SMTP)
        # Non-fatal: the site still deploys; the warning explains what to fix.
        continue-on-error: true
        run: node scripts/configure-supabase-auth.mjs

      - name: Build for Cloudflare
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.sbkeys.outputs.anon }}
        run: npm run cf:build

      - name: Ensure R2 cache bucket
        run: npx wrangler r2 bucket create impactcommunitygroup-opennext-cache || echo "bucket exists"

      - name: Deploy Worker
        run: npx opennextjs-cloudflare deploy

      - name: Sync Worker secrets
        env:
          SERVICE_ROLE: ${{ steps.sbkeys.outputs.service }}
          ANON: ${{ steps.sbkeys.outputs.anon }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          node -e '
            const s = {
              NEXT_PUBLIC_SUPABASE_URL: `https://${process.env.SUPABASE_PROJECT_REF}.supabase.co`,
              NEXT_PUBLIC_SUPABASE_ANON_KEY: process.env.ANON,
              NEXT_PUBLIC_SITE_URL: process.env.NEXT_PUBLIC_SITE_URL,
              NEXT_PUBLIC_BRAND_NAME: process.env.NEXT_PUBLIC_BRAND_NAME,
              SUPABASE_SERVICE_ROLE_KEY: process.env.SERVICE_ROLE,
              STRIPE_SECRET_KEY: process.env.STRIPE_SECRET_KEY,
              STRIPE_ALLOW_LIVE: process.env.STRIPE_ALLOW_LIVE,
              RESEND_API_KEY: process.env.RESEND_API_KEY,
              EMAIL_FROM: process.env.EMAIL_FROM,
              CRON_SECRET: process.env.CRON_SECRET,
            };
            for (const k of Object.keys(s)) if (!s[k]) delete s[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(s), { mode: 0o600 });
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Ensure Stripe webhooks
        if: env.STRIPE_SECRET_KEY != ''
        run: |
          node scripts/ensure-stripe-webhook.mjs --secret-out stripe-secrets.json
          if [ -s stripe-secrets.json ] && [ "$(cat stripe-secrets.json)" != "{}" ]; then
            npx wrangler secret bulk stripe-secrets.json
          fi
          rm -f stripe-secrets.json

      - name: Smoke test
        run: |
          for path in / /organizations /events /api/cron/emails; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$NEXT_PUBLIC_SITE_URL$path")
            echo "$path -> $code"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_SITE_URL/")" = "200"
